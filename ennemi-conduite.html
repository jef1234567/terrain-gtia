<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ennemi – redirection</title>
<!-- Ancien outil « Ennemi conduite », remplacé le 12/11/2026 par l'outil unique ennemi.html (mode conduite).
     Redirige en gardant les paramètres (?zone=…) et l'ancre. Les anciens fichiers .json (ennemi-conduite-gtia v1) s'ouvrent dans ennemi.html. -->
<script>
(function(){ var q = new URLSearchParams(location.search); q.set("mode", "conduite");
 location.replace("ennemi.html?" + q.toString() + location.hash); })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=ennemi.html?mode=conduite"></noscript>
</head>
<body style="font:15px system-ui,sans-serif;padding:20px">
<p>L'outil a changé de nom : <a href="ennemi.html?mode=conduite">ouvrir l'outil Ennemi (mode conduite)</a>.</p>
</body>
</html>
